<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MAS Research</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- KaTeX LaTeX Renderer CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <!-- Marked.js Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app-layout">
    
    <!-- Sidebar (Gemini Style) -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <button id="new-chat-btn" class="new-chat-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          New Chat
        </button>
      </div>

      <div class="sidebar-section">
        <div class="section-title">Research Mode</div>
        <div class="mode-selector">
          <button class="mode-btn active" data-mode="standard">Standard</button>
          <button class="mode-btn" data-mode="quick">Quick</button>
          <button class="mode-btn" data-mode="deep">Deep</button>
        </div>
      </div>

      <div class="sidebar-section flex-1">
        <div class="section-title">Recent Chats</div>
        <div id="chat-history-list" class="chat-history-list">
          <!-- Populated dynamically -->
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="status-pill">
          <span class="status-dot"></span>
          <span id="api-status">Ready</span>
        </div>
      </div>
    </aside>

    <!-- Main Chat Workspace -->
    <main class="chat-main">
      
      <!-- Top Navbar -->
      <header class="top-nav">
        <div class="brand">
          <svg class="gemini-spark" viewBox="0 0 24 24" width="22" height="22">
            <path fill="currentColor" d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/>
          </svg>
          <span class="brand-title">MAS Research</span>
        </div>

        <div class="header-kg">
          <span class="kg-pill">Nodes: <b id="kg-nodes">0</b></span>
          <span class="kg-pill">Edges: <b id="kg-edges">0</b></span>
        </div>
      </header>

      <!-- Chat Messages Container -->
      <div id="chat-viewport" class="chat-viewport">
        <div id="chat-messages" class="chat-messages">
          <div class="welcome-screen" id="welcome-screen">
            <div class="spark-large">✦</div>
            <h1>What research problem shall we explore?</h1>
            <p>Ask a research question or request a mathematical derivation.</p>
          </div>
        </div>
      </div>

      <!-- Bottom Fixed Input Bar -->
      <div class="input-container">
        <div class="input-box">
          <textarea id="query-input" rows="1" placeholder="Ask a research prompt or follow-up cross-question..."></textarea>
          <button id="send-btn" class="send-btn" title="Send">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </div>
      </div>

    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
